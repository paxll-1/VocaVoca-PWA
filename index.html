<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VocaVoca" />
    <meta name="description" content="Английские слова на понятных примерах. Пилот VocaVoca." />
    <title>VocaVoca</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="./fonts/golos_text.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="./fonts/literata.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="./fonts/literata_italic.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./visual.css" />
    <script type="module" src="./src/app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>
    <div id="error" class="notice error" role="alert" hidden></div>
    <div id="update" class="notice" role="status" hidden></div>
    <aside id="norm-praise" class="norm-praise" hidden aria-label="Дневная норма">
      <div role="status"><strong>Норма на сегодня выполнена.</strong><span id="praise-phrase"></span></div>
      <button id="dismiss-praise" type="button" aria-label="Свернуть подтверждение дневной нормы">
        Свернуть
      </button>
    </aside>
    <main id="main" tabindex="-1"><p class="loading">Открываем VocaVoca…</p></main>
    <nav id="nav" aria-label="Основные разделы"></nav>
    <noscript>Для карточек и сохранения ответов нужен JavaScript.</noscript>
  </body>
</html>
